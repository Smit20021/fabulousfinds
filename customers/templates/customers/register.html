
<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Design by foolishdeveloper.com -->
    <title>Fabulous Finds :: Customer Registration</title>
 
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
    <!--Stylesheet-->
    <style media="screen">
      *,
*:before,
*:after{
    padding: 0;
    margin: 0;
    box-sizing: border-box;
}
body{
    background-color: #080710;
}
.background{
    width: 430px;
    height: 520px;
    position: absolute;
    transform: translate(-50%,-50%);
    left: 50%;
    top: 50%;
}
.background .shape{
    height: 200px;
    width: 200px;
    position: absolute;
    border-radius: 50%;
}
.shape:first-child{
    background: linear-gradient(
        #1845ad,
        #23a2f6
    );
    left: -80px;
    top: -80px;
}
.shape:last-child{
    background: linear-gradient(
        to right,
        #ff512f,
        #f09819
    );
    right: -30px;
    bottom: -80px;
}
form{
    height: 900px;
    width: 400px;
    background-color: rgba(255,255,255,0.13);
    position: absolute;
    transform: translate(-50%,-50%);
    top: 60%;
    left: 50%;
    border-radius: 10px;
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255,255,255,0.1);
    box-shadow: 0 0 40px rgba(8,7,16,0.6);
    padding: 50px 35px;
}
form *{
    font-family: 'Poppins',sans-serif;
    color: #ffffff;
    letter-spacing: 0.5px;
    outline: none;
    border: none;
}
form h3{
    font-size: 32px;
    font-weight: 500;
    line-height: 42px;
    text-align: center;
}

label{
    display: block;
    margin-top: 30px;
    font-size: 16px;
    font-weight: 500;
}
input{
    display: block;
    height: 50px;
    width: 100%;
    background-color: rgba(255,255,255,0.07);
    border-radius: 3px;
    padding: 0 10px;
    margin-top: 8px;
    font-size: 14px;
    font-weight: 300;
}
::placeholder{
    color: #e5e5e5;
}
button{
    margin-top: 50px;
    width: 100%;
    background-color: #ffffff;
    color: #080710;
    padding: 15px 0;
    font-size: 18px;
    font-weight: 600;
    border-radius: 5px;
    cursor: pointer;
}
.social{
  margin-top: 30px;
  display: flex;
}
.social div{
  background: red;
  width: 150px;
  border-radius: 3px;
  padding: 5px 10px 10px 5px;
  background-color: rgba(255,255,255,0.27);
  color: #eaf0fb;
  text-align: center;
}
.social div:hover{
  background-color: rgba(255,255,255,0.47);
}
.social .fb{
  margin-left: 25px;
}
.social i{
  margin-right: 4px;
}
select {
       
       
        background-color:rgba(255,255,255,0.13);
        background-image: none;
        cursor: pointer;
        border: 1px solid black;
        border-radius: 3px;
        width: 100%;
        height:8%;
        color:black;
    }
    </style>
</head>
<body>
    <div class="background">
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    <form action="#" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <h4>Customer Registration</h4>

        <label for="username">Name</label>
        {{form.name}}

        <label for="password">Address</label>
        {{form.address}}

        <label for="password">City</label>
        <select required name="cityId" id="cityId">
            <option value=""  style="color:black;">---Select City---</option>
            {% for data in CityData %}
            <option value="{{data.id}}"  style="color:black;"
                {% if SelectedCity and SelectedCity.cityName in data.cityName %} 
                  selected
                {%endif%}>
                {{data.cityName}}
            </option>
        {% endfor %}
        </select>

        <label for="password">Area</label>
        <select required name="areaId" id="areaId">
            {% for data in areaData %}
            <option  value="{{data.id}}"  
                {% if SelectedArea and SelectedArea.areaName in data.areaName %} 
                  selected
                {%endif%}>
                {{data.areaName}}
            </option>
            {% endfor %}
          </select>

        <label for="password">ContactNo.</label>
        {{form.contactNo}}

        <label for="password">Password</label>
        {{form.password}}


        <button type="submit" id="btnsubmit" class="btn text-white btn-block btn-primary" style="margin-top:10px; width:325px;">Submit</button>


        <!-- <div class="social">
          <div class="go"><i class="fab fa-google"></i>  Google</div>
          <div class="fb"><i class="fab fa-facebook"></i>  Facebook</div>
        </div>  -->
    </form>
</body>
</html>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
<script>
 $(document).ready(function() {
     $('#contactno').on('input change blur', function() {
         if($(this).val() != '' && $("#contactno").val().length == 10) {
             $('#btnsubmit').prop('disabled', false);
         } else {
             $('#btnsubmit').prop('disabled', true);
         }
     });
 });
 </script>
<script type="text/javascript">
                
    function restrictAlphabets(evt) {
        var x = (evt.which) ? evt.which : event.keyCode
        if ((x >= 48 && x <= 57) || x == 8 )
            return true;
        else
            return false;
    }
</script>

 <script language="Javascript" type="text/javascript">
  function isNumberKey(evt) {
      var charCode = (evt.which) ? evt.which : event.keyCode
      if ((charCode <= 93 && charCode >= 65) || (charCode <= 122 && charCode >= 97) || charCode == 8 || charCode == 32) {

          return true;
      }

      return false;

  }
</script>

<script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
<script>
 $(document).ready(
   $("#cityId").change(function () {
    var cityid = $(this).val();  
    $("#areaId").empty();
    $.ajax({                       
      url: "{% url 'customers:load_areas' %}",       
      data: {
        'city_id': cityid      
      },
      success: function (data) {   
        $("#areaId").html(data);  

      }
    });  
   
   })
 );
 </script>
