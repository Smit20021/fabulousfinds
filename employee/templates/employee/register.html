{% extends 'adminapp/base.html' %}
{% load crispy_forms_tags %}
{% block contents %}

<div class="col-12 grid-margin stretch-card">
    <div class="card">
      <div class="card-body">
        <h4 class="card-title">New Admin Registration</h4>
        
            {% for message in messages %}
                <div class="container-fluid p-0">
                    <div class="alert {{ message.tags }} alert-dismissible" role="alert" >
                        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                        <span aria-hidden="True">&times;</span>
                        </button>
                        {{ message }}
                    </div>
                </div>
            {% endfor %}
            <form action="/admin/register/" method="POST" class="form-horizontal">
                {% csrf_token%}
                <div class="mx-auto" style="width: 400px;">
        
                    <div class="col-xs-8 col-xs-offset-4">
                        <h2 style="text-align:center;">SIGN UP</h2>
                    </div>
                    <hr />
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" class="form-control" name="username" id="username" placeholder="Enter Username"
                            Required>
                    </div>
                    <div class="form-group">
                        <label for="fanme">First Name</label>
                        <input type="text" class="form-control" name="first_name" id="first_name" placeholder="Enter First Name"
                            Required>
                    </div>
                    <div class="form-group">
                        <label for="lname">Last Name</label>
                        <input type="text" class="form-control" name="last_name" id="last_name" placeholder="Enter Last Name"
                            Required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email address</label>
                        <input type="email" class="form-control" name="email" id="email" placeholder="Enter email" Required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" class="form-control" name="password" id="password" placeholder="Enter Password"
                            Required>
                    </div>
                    <div class="form-group">
                        <label for="confirm_password">Confirm Password</label>
                        <input type="password" class="form-control" name="confirm_password" id="confirm_password"
                            placeholder="Confirm Your Password" Required>
                    </div>
                    <button type="submit" class="btn btn-primary">SIGNUP</button>
                    <a class="btn btn-dark" href="login_user" role="button">LOGIN</a>
                </div>
            </form>
           
        </div>
    </div>
</div>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
<script>
 $(document).ready(function() {
     $('#id_contactno').on('input change blur', function() {
         if($(this).val() != '' && $("#id_contactno").val().length == 10) {
             $('#btnsubmit').prop('disabled', false);
         } else {
             $('#btnsubmit').prop('disabled', true);
         }
     });
 });
 </script>
<script type="text/javascript">
                
    function restrictAlphabets(evt) {
        var x = (evt.which) ? evt.which : event.keyCode
        if ((x >= 48 && x <= 57) || x == 8 )
            return true;
        else
            return false;
    }
</script>

 <script language="Javascript" type="text/javascript">
  function isNumberKey(evt) {
      var charCode = (evt.which) ? evt.which : event.keyCode
      if ((charCode <= 93 && charCode >= 65) || (charCode <= 122 && charCode >= 97) || charCode == 8 || charCode == 32) {

          return true;
      }

      return false;

  }
</script>
{% endblock contents %}
